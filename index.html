<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Niko UltraVision Pro — restauration et agrandissement local d'images et de vidéos, sans API payante."
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>Niko UltraVision Pro</title>
    <script>
      (() => {
        const sw = navigator.serviceWorker;
        if (!sw || window.crossOriginIsolated || !window.isSecureContext) return;

        const params = new URLSearchParams(location.search);
        if (params.get("coi") === "0") {
          sw.getRegistrations()
            .then((registrations) => {
              registrations.forEach((registration) => registration.unregister());
            })
            .catch(() => {});
          return;
        }

        const flag = "uv-coi-reload";
        let touched = false;

        const markTouched = () => {
          touched = true;
        };

        ["pointerdown", "keydown", "change", "drop", "touchstart"].forEach((type) => {
          window.addEventListener(type, markTouched, { capture: true, passive: true });
        });

        const reloadOnce = () => {
          if (touched || sessionStorage.getItem(flag) === "1") return;
          sessionStorage.setItem(flag, "1");
          location.reload();
        };

        sw.register(new URL("./coi-sw.js", window.location.href).href)
          .then((registration) => {
            if (sessionStorage.getItem(flag) === "1") return;

            if (sw.controller) {
              reloadOnce();
              return;
            }

            sw.addEventListener(
              "controllerchange",
              () => {
                reloadOnce();
              },
              { once: true }
            );

            if (registration.active) {
              reloadOnce();
            }
          })
          .catch(() => {
            // Mode mono-thread sans SW, l'application continue normalement.
          });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div
        style="padding: 2rem; font-family: system-ui, sans-serif; color: #e8edf7; background: #07111f; min-height: 100vh; display: grid; place-items: center; text-align: center;"
      >
        JavaScript est requis pour utiliser Niko UltraVision Pro.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
