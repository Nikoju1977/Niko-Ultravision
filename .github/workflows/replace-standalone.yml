name: Replace with standalone UltraVision

on:
  push:
    paths:
      - .github/workflows/replace-standalone.yml

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace repository with standalone source
        shell: bash
        run: |
          cat > /tmp/ultravision.b64 <<'ARCHIVE'
          
          ARCHIVE
          base64 -d /tmp/ultravision.b64 > /tmp/ultravision.tar.gz
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/ultravision.tar.gz -C .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace Higgsfield scaffold with standalone local engine"
          git push
