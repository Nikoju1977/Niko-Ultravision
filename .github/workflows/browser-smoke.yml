name: Browser Smoke Test

on:
  push:
    paths:
      - .github/workflows/browser-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Install app
        run: npm install --no-audit --no-fund
      - name: Install browser test runtime
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install chromium
      - name: Build
        run: npm run build
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Create test media
        run: |
          python3 - <<'PY'
          import base64, pathlib
          pathlib.Path("test.png").write_bytes(base64.b64decode("iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAIAAAD91JpzAAAAFElEQVR42mP8z8AARAwMjIwgBgAALQAB/2Yx0QAAAABJRU5ErkJggg=="))
          PY
          ffmpeg -y -f lavfi -i testsrc=size=320x180:rate=30 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 1 -c:v libvpx-vp9 -pix_fmt yuv420p -c:a libopus test.webm
      - name: Browser functional test
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/ultravision-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173 >/dev/null && break
            sleep 1
          done
          cat > smoke.mjs <<'JS'
          import { chromium } from "playwright";
          import path from "node:path";

          const browser = await chromium.launch({headless:true,args:["--autoplay-policy=no-user-gesture-required"]});
          const page = await browser.newPage();
          const external = [];
          page.on("request", req => {
            const u = new URL(req.url());
            if ((u.protocol === "http:" || u.protocol === "https:") && !["127.0.0.1","localhost"].includes(u.hostname)) external.push(req.url());
          });

          await page.goto("http://127.0.0.1:4173", {waitUntil:"networkidle"});
          if ((await page.title()) !== "Niko UltraVision Pro") throw new Error("Wrong title");

          const input = page.locator('input[type="file"]');

          await input.setInputFiles(path.resolve("test.png"));
          await page.getByText("Source analysée localement").waitFor({timeout:10000});
          await page.getByRole("button", {name:/^Original/}).click();
          await page.getByRole("button", {name:"Créer le master local"}).click();
          await page.getByText("Master terminé").waitFor({timeout:20000});
          if (!(await page.getByRole("button", {name:"Télécharger"}).isVisible())) throw new Error("Image export missing");

          await input.setInputFiles(path.resolve("test.webm"));
          await page.getByText("Source analysée localement").waitFor({timeout:10000});
          await page.getByRole("button", {name:/^Original/}).click();
          await page.getByRole("button", {name:"Créer le master local"}).click();
          await page.getByText("Master terminé").waitFor({timeout:30000});
          if (!(await page.getByRole("button", {name:"Télécharger"}).isVisible())) throw new Error("Video export missing");

          if (external.length) throw new Error("Unexpected external network requests: " + external.join(", "));
          console.log("BROWSER_SMOKE_OK image+video local processing; no external HTTP requests");
          await browser.close();
          JS
          node smoke.mjs
