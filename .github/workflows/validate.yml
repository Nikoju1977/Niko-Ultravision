name: Validate UltraVision

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
